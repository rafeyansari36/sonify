# Server
server.port=${PORT:8080}

# MongoDB — provided via env vars in production
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE:sonify}

# CORS — allowed origin(s) per environment
sonify.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:52384}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
