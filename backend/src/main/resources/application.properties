# Server
server.port=${PORT:8080}

# MongoDB — provided in production via SPRING_DATA_MONGODB_URI env var (Spring Boot relaxed binding)

# CORS — allowed origin(s) per environment
sonify.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:52384}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
