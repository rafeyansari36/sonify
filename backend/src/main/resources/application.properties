# Server
server.port=${PORT:8080}

# MongoDB — Spring Boot 4.0 prefix is `spring.mongodb.*` (was `spring.data.mongodb.*` in 3.x)
# Production: set SPRING_MONGODB_URI env var. Local dev: see application-local.properties (gitignored)
spring.mongodb.uri=${SPRING_MONGODB_URI:}

# CORS — allowed origin(s) per environment
sonify.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:52384}

# File upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
