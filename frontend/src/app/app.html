<div class="min-h-screen flex flex-col">
 <nav class="border-b border-white/10 backdrop-blur-md bg-sonify-bg/80 sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between gap-2">
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-2 sm:gap-3 group shrink-0">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-sonify-accent to-sonify-accent-2
                  flex items-center justify-center text-lg sm:text-xl font-bold
                  group-hover:animate-pulse-glow transition-all">
        S
      </div>
      <span class="hidden sm:inline text-xl font-bold tracking-tight">
        Sonify<span class="text-sonify-accent">.</span>
      </span>
    </a>

    <!-- Nav links -->
    <div class="flex items-center gap-0.5 sm:gap-2">
      <a routerLink="/" routerLinkActive="bg-white/10 text-sonify-accent"
         [routerLinkActiveOptions]="exactMatch"
         class="px-2.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-gray-300
                hover:bg-white/5 hover:text-white transition-colors">
        Upload
      </a>
      <a routerLink="/map" routerLinkActive="bg-white/10 text-sonify-accent"
         class="px-2.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-gray-300
                hover:bg-white/5 hover:text-white transition-colors">
        Map
      </a>
      <a routerLink="/play" routerLinkActive="bg-white/10 text-sonify-accent"
         class="px-2.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-gray-300
                hover:bg-white/5 hover:text-white transition-colors">
        Play
      </a>
      <a routerLink="/library" routerLinkActive="bg-white/10 text-sonify-accent"
         class="px-2.5 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-medium text-gray-300
                hover:bg-white/5 hover:text-white transition-colors">
        Library
      </a>
    </div>
  </div>
</nav>

  <!-- Background gradient effect -->
  <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-sonify-accent/20 rounded-full blur-3xl"></div>
    <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-sonify-accent-2/20 rounded-full blur-3xl"></div>
  </div>

  <!-- Page content -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="border-t border-white/10 py-6 text-center text-sm text-gray-500">
    <p>Built with Angular + Tone.js. Turn data into music.</p>
  </footer>
</div>
